[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "axiom-ext-cia402"
version = "0.1.0"
description = "A CiA 402 servo drive emulator (object dictionary, power state machine, profile position, cyclic synchronous position) and the host-side client that drives it or a real drive. No dependencies."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "The University of Texas at Austin" }, { name = "B-Tree Labs" }]
keywords = ["CiA 402", "CANopen", "EtherCAT", "servo drive", "emulator"]
dependencies = []

[project.urls]
Repository = "https://github.com/UT-Computational-NE/axiom-ext-cia402"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/axiom_ext_cia402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
